appId: dev.effectlocal.chat
---
- extendedWaitUntil:
    visible:
      id: "conversation-${CONVERSATION}"
    timeout: 30000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "conversation-${CONVERSATION}"
      - extendedWaitUntil:
          visible:
            id: "chat-title"
          timeout: 10000
- extendedWaitUntil:
    visible: "${TEXT}"
    timeout: 30000
