appId: dev.effectlocal.chat
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
      - launchApp:
          clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
- extendedWaitUntil:
    visible:
      id: "login-user-${USER}"
    timeout: 60000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "login-user-${USER}"
      - tapOn:
          id: "login-password"
      - eraseText
      - inputText: "${USER}123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "me-name"
          timeout: 30000
