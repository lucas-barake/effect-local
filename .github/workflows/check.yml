name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm dead-code
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm circular
      - run: pnpm docgen

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/chat
      - run: pnpm run e2e
        working-directory: examples/chat
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: examples/chat/test-results

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - name: Build the Expo release APK
        working-directory: examples/chat/mobile
        env:
          EXPO_PUBLIC_CHAT_SERVER_URL: http://10.0.2.2:4199
          NODE_ENV: production
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: examples/chat
      - name: Run the web and Android e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb install examples/chat/mobile/android/app/build/outputs/apk/release/app-release.apk
            pnpm -C examples/chat run e2e:mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-results
          path: |
            examples/chat/test-results
            ~/.maestro/tests

  e2e-ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: pnpm install --frozen-lockfile
      - name: Build the Expo release app for the iOS simulator
        working-directory: examples/chat/mobile
        env:
          EXPO_PUBLIC_CHAT_SERVER_URL: http://localhost:4199
          NODE_ENV: production
        run: |
          pnpm exec expo prebuild --platform ios
          xcodebuild -workspace ios/EffectChat.xcworkspace -scheme EffectChat -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath ios/build \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Boot a simulator and install the app
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            const devices = JSON.parse(require("fs").readFileSync(0, "utf8")).devices
            const runtime = Object.keys(devices).filter((name) => name.includes("iOS")).sort().at(-1)
            console.log(devices[runtime].find((device) => device.name.startsWith("iPhone")).udid)
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" examples/chat/mobile/ios/build/Build/Products/Release-iphonesimulator/EffectChat.app
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: pnpm exec playwright install chromium
        working-directory: examples/chat
      - name: Run the web and iOS e2e
        env:
          MOBILE_PLATFORM: ios
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
        run: pnpm -C examples/chat run e2e:mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios-results
          path: |
            examples/chat/test-results
            ~/.maestro/tests

  supported-node:
    strategy:
      matrix:
        node-version: [22.22.2, 24.15.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --engine-strict
      - run: pnpm build
      - run: pnpm test --run

  unsupported-node:
    strategy:
      matrix:
        node-version: [18.20.8, 20.19.5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Reject unsupported Node
        run: |
          if pnpm install --frozen-lockfile --engine-strict >node-engine.log 2>&1
          then
            cat node-engine.log
            exit 1
          fi
          cat node-engine.log
          grep -q "ERR_PNPM_UNSUPPORTED_ENGINE" node-engine.log
